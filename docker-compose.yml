services:
  postgres:
    image: postgres:17-alpine
    container_name: serene_health_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serene}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serene_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-serene_health}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serene -d serene_health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
