          - generic [ref=f1e64]:
            - paragraph [ref=f1e65]: Chào bạn, tôi là Serene – trợ lý AI hỗ trợ tư vấn sức khỏe ban đầu (không phải là bác sĩ). Đau lưng có thể xuất phát từ nhiều nguyên nhân khác nhau như căng cơ, sai tư thế, thoái hóa hoặc vấn đề về đĩa đệm.
            - paragraph [ref=f1e66]: "Để có thể gợi ý hướng xử trí phù hợp hơn, bạn có thể chia sẻ thêm một số thông tin:"
            - list [ref=f1e67]:
              - listitem [ref=f1e68]:
                - strong [ref=f1e69]: "Vị trí và tính chất cơn đau:"
                - text: Bạn đau ở vùng thắt lưng hay lưng trên? Đau âm ỉ, nhức mỏi hay đau nhói buốt? Cơn đau có lan xuống mông hay cẳng chân không?
              - listitem [ref=f1e70]:
                - strong [ref=f1e71]: "Thời gian:"
                - text: Bạn bị đau từ bao lâu rồi (mới vài ngày hay kéo dài nhiều tuần)?
              - listitem [ref=f1e72]:
                - strong [ref=f1e73]: "Hoàn cảnh khởi phát:"
                - text: Đau có xuất hiện sau khi khiêng vác nặng, xoay người đột ngột, chấn thương hay do ngồi làm việc nhiều không?
            - separator [ref=f1e74]
            - heading "Khi nào cần đi khám cấp cứu hoặc khám bác sĩ ngay?" [level=5] [ref=f1e75]
            - paragraph [ref=f1e76]: "Bạn nên đến cơ sở y tế ngay nếu đau lưng kèm theo bất kỳ dấu hiệu cảnh báo nào sau đây:"
            - list [ref=f1e77]:
              - listitem [ref=f1e78]:
                - text: Đau kèm
                - strong [ref=f1e79]: tê bì, yếu liệt hoặc mất cảm giác ở chân/bàn chân
                - text: .
              - listitem [ref=f1e80]: Mất kiểm soát tiểu tiện hoặc đại tiện (tiểu không tự chủ, bí tiểu).
              - listitem [ref=f1e81]: Đau dữ dội sau chấn thương, ngã hoặc va đập mạnh.
              - listitem [ref=f1e82]: Đau lưng kèm sốt, sụt cân không rõ nguyên nhân, hoặc cơn đau không đỡ ngay cả khi nằm nghỉ ngơi.
            - separator [ref=f1e83]
            - heading "Một số biện pháp hỗ trợ giảm đau tại nhà (cho trường hợp đau cơ nhẹ do tư thế/vận động):" [level=5] [ref=f1e84]
            - list [ref=f1e85]:
              - listitem [ref=f1e86]:
                - strong [ref=f1e87]: "Chườm ấm hoặc chườm lạnh:"
                - text: Nếu mới đau trong 24–48 giờ đầu do căng cơ, có thể chườm lạnh 15–20 phút để giảm viêm. Nếu đau nhức mỏi cơ kéo dài, chườm ấm giúp thư giãn cơ.
              - listitem [ref=f1e88]:
                - strong [ref=f1e89]: "Nghỉ ngơi và vận động nhẹ nhàng:"
                - text: Tránh nằm bất động trên giường quá lâu vì có thể làm cứng cơ. Nên đi lại nhẹ nhàng, kéo giãn nhẹ nếu không gây đau thêm.
              - listitem [ref=f1e90]:
                - strong [ref=f1e91]: "Điều chỉnh tư thế:"
                - text: Giữ lưng thẳng khi ngồi, dùng gối đỡ thắt lưng; khi nhấc vật nặng, hãy gập đầu gối và dùng lực của chân thay vì cúi gập lưng.
              - listitem [ref=f1e92]:
                - strong [ref=f1e93]: "Tư thế ngủ:"
                - text: Nằm nghiêng co nhẹ gối (kẹp gối giữa hai chân) hoặc nằm ngửa kê gối dưới khoeo chân để giảm áp lực lên cột sống.
            - paragraph [ref=f1e94]: Nếu cơn đau kéo dài hoặc ảnh hưởng nhiều đến sinh hoạt, bạn nên đến gặp bác sĩ chuyên khoa Cơ Xương Khớp hoặc Cột sống để được thăm khám và chụp chiếu chẩn đoán chính xác. Nếu bạn cần tìm bác sĩ chuyên khoa hoặc kiểm tra lịch khám tại phòng khám, hãy cho tôi biết nhé!
